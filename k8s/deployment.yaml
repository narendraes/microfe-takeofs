apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfe-takeofs
  labels:
    app: microfe-takeofs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microfe-takeofs
  template:
    metadata:
      labels:
        app: microfe-takeofs
    spec:
      containers:
      - name: microfe-takeofs
        image: ${DOCKER_REGISTRY}/microfe-takeofs:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
        env:
        - name: NODE_ENV
          value: "production"
      imagePullSecrets:
      - name: regcred 