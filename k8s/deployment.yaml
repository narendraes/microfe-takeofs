apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfe-takeofs
  labels:
    app: microfe-takeofs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microfe-takeofs
  template:
    metadata:
      labels:
        app: microfe-takeofs
    spec:
      containers:
      - name: microfe-takeofs
        image: ${DOCKER_REGISTRY}/microfe-takeofs:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: NODE_ENV
          value: "production"
        # ConfigMap environment variables
        envFrom:
        - configMapRef:
            name: microfe-takeofs-config
        # Secret environment variables
        - secretRef:
            name: microfe-takeofs-secrets
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: microfe-takeofs
spec:
  selector:
    app: microfe-takeofs
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microfe-takeofs
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: ${DOMAIN_NAME}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: microfe-takeofs
            port:
              number: 80 